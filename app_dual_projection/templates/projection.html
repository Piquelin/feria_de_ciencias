<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyección 16:9 | YOLO26 Multi-Vision Explorer v2</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="projection-body">

    <!-- Escenario de Proyección Panorámica a Pantalla Completa 16:9 -->
    <div class="projection-stage">
        
        <!-- Stream de Video Principal 16:9 -->
        <img id="projectionVideoStream" class="projection-stream" src="/video_feed/triple" alt="Proyección YOLO26 16:9">

        <!-- OSD (On-Screen Display) Flotante para la Audiencia -->
        <div id="projectionOSD" class="projection-osd">
            
            <div class="osd-brand">
                <div class="osd-title-badge">
                    <span class="osd-logo">YOLOv26</span>
                    <span id="osdModeName" class="osd-mode-name">⚡ MALLA TRIPLE 16:9 (POSE PRINCIPAL)</span>
                </div>
            </div>

            <div class="osd-metrics-cluster">
                <div class="osd-pill osd-fps">
                    <span class="osd-label">FPS</span>
                    <span id="osdFps" class="osd-value">0</span>
                </div>
                <div class="osd-pill osd-lat">
                    <span class="osd-label">Latencia Total</span>
                    <span id="osdLat" class="osd-value">0ms</span>
                </div>
                <div class="osd-pill osd-count">
                    <span id="osdCountLabel" class="osd-label">Detecciones</span>
                    <span id="osdCount" class="osd-value">0 / 0</span>
                </div>
                <button id="btnProjectionClose" class="osd-pill" style="cursor: pointer; background: rgba(255, 51, 102, 0.2); border-color: rgba(255, 51, 102, 0.5);" title="Cerrar ventana de proyección (Q)">
                    <span class="osd-label" style="color: #ff4d6d;">Ventana</span>
                    <span class="osd-value" style="font-size: 1rem; color: #ff4d6d;">✕ Cerrar</span>
                </button>
            </div>

        </div>

        <!-- Banner Flotante de Pausa / Freeze -->
        <div id="freezeBanner" class="freeze-banner">
            <span>⏸️ ANÁLISIS EN PAUSA (EXPLICACIÓN AL PÚBLICO)</span>
        </div>

        <!-- Barra Inferior de Atajos de Teclado -->
        <div id="projectionShortcuts" class="projection-shortcuts-bar">
            <div class="shortcut-item"><span class="key-badge">F</span> Pantalla Completa</div>
            <div class="shortcut-item"><span class="key-badge">H</span> OSD</div>
            <div class="shortcut-item"><span class="key-badge">1</span> Malla 16:9</div>
            <div class="shortcut-item"><span class="key-badge">2 - 4</span> Individuales</div>
            <div class="shortcut-item"><span class="key-badge">T</span> Rotar Principal</div>
            <div class="shortcut-item"><span class="key-badge">Espacio</span> Congelar</div>
            <div class="shortcut-item"><span class="key-badge">C</span> Contraste</div>
            <div class="shortcut-item"><span class="key-badge">M</span> Espejo</div>
            <div class="shortcut-item"><span class="key-badge">Q</span> Salir</div>
        </div>

        <!-- Toast de Notificaciones -->
        <div id="toastNotice" class="toast-notice">MODO: MALLA TRIPLE 16:9</div>

    </div>

    <script src="{{ url_for('static', filename='js/projection.js') }}"></script>
</body>
</html>
